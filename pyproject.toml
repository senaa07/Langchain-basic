[project]
name = "llm-1"
version = "0.1.0"
description = "This is my first project in Landchain"
authors = [
    {name = "Sena Abhishek"}
]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "langchain-openai (>=0.3.14,<0.4.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "langchain-google-firestore (>=0.5.0,<0.6.0)",
    "langchain-chroma (>=0.2.3,<0.3.0)",
    "langchain-huggingface (>=0.1.2,<0.2.0)",
    "sentence-transformers (>=4.1.0,<5.0.0)",
    "langchain-ollama (>=0.3.2,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
